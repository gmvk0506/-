<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小黃的詳細資料 | 毛孩找家平台</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* 核心設計與全局設定 */
        :root {
            --primary-orange: #ff9f43;
            --soft-brown: #5d4037;
            --bg-cream: #fffdf8;
            --text-gray: #636e72;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg-cream);
            color: var(--text-gray);
            line-height: 1.6;
            margin: 0;
            padding: 40px 5%;
        }

        /* 返回按鈕 */
        .back-home {
            text-decoration: none;
            color: var(--primary-orange);
            font-weight: bold;
            margin-bottom: 20px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }

        .back-home:hover {
            color: #e67e22;
        }

        /* 內容容器 */
        .container {
            align-items: center;
            background-color: white; /* 純白內容背景 */
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            justify-content: center;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px;
            position: relative;
            overflow: hidden;
        }

        /* 裝飾背景：手繪感小狗腳印 (偽元素) */
        .container::after {
            content: '\f1b0'; /* FontAwesome Paw Icon */
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            position: absolute;
            bottom: -50px;
            right: -30px;
            font-size: 200px;
            color: rgba(255, 159, 67, 0.03); /* 極淡的橘色腳印 */
            z-index: 0;
            pointer-events: none;
        }

        .container > * {
            position: relative;
            z-index: 1;
            width: 100%;
        }

        /* 標題與標籤 */
        h1, h3 {
            color: var(--soft-brown);
            margin: 0 0 10px;
        }

        h1 {
            font-size: 32px;
        }

        h3 {
            font-size: 22px;
            margin-top: 30px;
            border-bottom: 2px solid #ffefe0;
            padding-bottom: 8px;
        }

        .tag {
            display: inline-block;
            background: #fff0eb;
            color: #d17531;
            padding: 6px 15px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: bold;
            margin-right: 8px;
        }

        /* 排版組件 */
        .dog-header {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            align-items: center;
            margin-bottom: 30px;
        }

        .main-img {
            width: 100%;
            height: 300px;
            border-radius: 20px;
            object-fit: cover;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        /* 基本資料表格 */
        .info-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .info-table td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        .info-label {
            font-weight: bold;
            width: 120px;
            color: var(--primary-orange);
            font-size: 1.1rem;
        }

        /* 生活照相簿 */
        .photo-gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 15px;
        }

        .photo-gallery img {
            width: 100%;
            height: 180px;
            border-radius: 10px;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .photo-gallery img:hover {
            transform: scale(1.05);
        }

        /* 捐款按鈕連回主頁 */
        .btn-donate {
            background: var(--primary-orange);
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            text-decoration: none;
            display: block;
            text-align: center;
            margin-top: 40px;
            font-weight: bold;
            font-size: 1.2rem;
            transition: 0.3s;
        }

        .btn-donate:hover {
            background: #e67e22;
        }

    </style>
</head>
<body>

    <a href="index.html" class="back-home"><i class="fa-solid fa-chevron-left"></i> 返回主頁</a>

    <div class="container">
        <div class="dog-header">
            <img src="https://placedog.net/600/400?id=1" class="main-img" alt="小黃">
            <div>
                <h1>我是小黃</h1>
                <p style="margin-bottom: 15px;">「嗨！我正在找一個能陪我玩球的家。」</p>
                <div>
                    <span class="tag">#2歲</span> 
                    <span class="tag">#活潑好動</span> 
                    <span class="tag">#愛撒嬌</span>
                </div>
            </div>
        </div>

        <h3>🐾 基本資料</h3>
        <table class="info-table">
            <tr>
                <td class="info-label">年齡</td>
                <td>約 2 歲</td>
            }
            <tr>
                <td class="info-label">個性</td>
                <td>非常聰明，學指令很快。喜歡和人互動，是個開朗的大男孩。</td>
            }
            <tr>
                <td class="info-label">健康狀況</td>
                <td>已完成晶片登記、完整疫苗、已絕育。目前健康狀況良好。</td>
            }
            <tr>
                <td class="info-label">我的故事</td>
                <td>小黃是在大雨中的校園角落被救援的，雖然經歷過辛苦的浪浪生活，但牠依然對人充滿信任...</td>
            }
        </table>

        <h3>📷 更多小黃的生活點滴</h3>
        <p style="margin-bottom: 15px;">讓我們看看不同角度、不同生活場景的小黃！</p>
        <div class="photo-gallery">
            <img src="https://placedog.net/600/400?id=101" alt="小黃在草地奔跑">
            <img src="https://placedog.net/600/400?id=102" alt="小黃慵懶睡午覺">
            <img src="https://placedog.net/600/400?id=103" alt="小黃戴聖誕帽">
        </div>

        <a href="index.html#donate" class="btn-donate">贊助小黃一罐肉罐頭</a>
    </div>

</body>
</html>
